{% extends 'base.html' %}{% block content %}<div class="row justify-content-center"><div class="col-lg-7"><div class="glass-card p-4"><h1 class="h3">Edit goal</h1><form method="post" class="row g-3 mt-1"><div class="col-12"><input class="form-control form-control-custom" name="name" value="{{ goal.name }}" required></div><div class="col-md-6"><input class="form-control form-control-custom" type="number" step="0.01" name="target_amount" value="{{ goal.target_amount }}" required></div><div class="col-md-6"><input class="form-control form-control-custom" type="number" step="0.01" name="current_amount" value="{{ goal.current_amount }}" required></div><div class="col-12"><input class="form-control form-control-custom" type="date" name="target_date" value="{{ goal.target_date.strftime('%Y-%m-%d') if goal.target_date else '' }}"></div><div><button class="btn btn-primary-custom">Save</button></div></form><form method="post" action="{{ url_for('goals.delete', goal_id=goal.id) }}" class="mt-3"><button class="btn btn-link text-danger p-0" onclick="return confirm('Delete this goal?')">Delete goal</button></form></div></div></div>{% endblock %}
