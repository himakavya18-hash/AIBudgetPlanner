{% extends 'base.html' %}{% block content %}<div class="d-flex justify-content-between mb-4"><h1 class="h2">Monthly budgets</h1><a class="btn btn-secondary-custom btn-sm" href="{{ url_for('ai.suggestions') }}">Generate with AI</a></div><div class="row g-4"><div class="col-lg-5"><div class="glass-card p-4"><h2 class="h5">Set a category limit</h2><form method="post" class="row g-3"><div class="col-12"><select class="form-select form-select-custom" name="category">{% for c in categories %}<option>{{ c }}</option>{% endfor %}</select></div><div class="col-12"><input class="form-control form-control-custom" type="number" min="1" step="0.01" name="amount_limit" placeholder="Limit in ₹" required></div><div class="col-12"><input class="form-control form-control-custom" type="month" name="month" value="{{ current_month }}" required></div><div class="col-12"><button class="btn btn-primary-custom">Save budget</button></div></form></div></div><div class="col-lg-7"><div class="glass-card p-4"><h2 class="h5">{{ current_month }} limits</h2><table class="table table-custom"><thead><tr><th>Category</th><th class="text-end">Limit</th></tr></thead><tbody>{% for b in budgets %}<tr><td>{{ b.category }}</td><td class="text-end">₹{{ '{:,.2f}'.format(b.amount_limit) }}</td></tr>{% else %}<tr><td colspan="2" class="text-secondary-custom">No category limits set.</td></tr>{% endfor %}</tbody></table></div></div></div>{% endblock %}
