{% extends 'base.html' %}{% block content %}<h1 class="h2 mb-4">Recurring expenses</h1><div class="row g-4"><div class="col-lg-5"><div class="glass-card p-4"><form method="post" action="{{ url_for('transactions.add_recurring') }}" class="row g-3"><input class="form-control form-control-custom" name="name" placeholder="Name (e.g. Netflix)" required><input class="form-control form-control-custom" type="number" name="amount" step="0.01" placeholder="Amount ₹" required><select class="form-select form-select-custom" name="category">{% for c in categories %}<option>{{ c }}</option>{% endfor %}</select><input class="form-control form-control-custom" type="number" min="1" max="31" name="due_day" placeholder="Due day (1–31)" required><button class="btn btn-primary-custom">Add recurring expense</button></form></div></div><div class="col-lg-7"><div class="glass-card p-4"><table class="table table-custom"><thead><tr><th>Name</th><th>Due</th><th>Amount</th><th></th></tr></thead><tbody>{% for r in recurrings %}<tr><td>{{ r.name }}<br><small>{{ r.category }}</small></td><td>{{ r.due_day }}th</td><td>₹{{ '{:,.2f}'.format(r.amount) }}</td><td><form method="post" action="{{ url_for('transactions.delete_recurring', recurring_id=r.id) }}"><button class="btn btn-link text-danger">Delete</button></form></td></tr>{% else %}<tr><td colspan="4" class="text-secondary-custom">No recurring expenses.</td></tr>{% endfor %}</tbody></table></div></div></div>{% endblock %}
