<form method="post" class="mt-4"><div class="row g-3"><div class="col-md-6"><label class="form-label">Amount (₹)</label><input class="form-control form-control-custom" type="number" step="0.01" min="0.01" name="amount" value="{{ transaction.amount if transaction is defined else '' }}" required></div><div class="col-md-6"><label class="form-label">Category</label><select class="form-select form-select-custom" name="category" required>{% for c in (categories if categories is defined else sources) %}<option {% if transaction is defined and transaction.category==c %}selected{% endif %}>{{ c }}</option>{% endfor %}</select></div><div class="col-12"><label class="form-label">Reason / description</label><input class="form-control form-control-custom" name="description" value="{{ transaction.description if transaction is defined else '' }}" placeholder="Write any reason, e.g. Swiggy order, birthday gift, bike repair"></div><div class="col-md-6"><label class="form-label">Date</label><input class="form-control form-control-custom" type="date" name="date" value="{{ transaction.date.strftime('%Y-%m-%d') if transaction is defined else today }}"></div></div><button class="btn btn-primary-custom mt-4">Save {{ kind }}</button> <a class="btn btn-secondary-custom mt-4" href="{{ url_for('transactions.index') }}">Cancel</a></form>
