{% extends 'base.html' %}{% block content %}<div class="row justify-content-center"><div class="col-lg-9"><div class="glass-card overflow-hidden"><div class="p-4 border-bottom"><h1 class="h4 mb-1">Financial assistant</h1><p class="text-secondary-custom mb-0">Ask about your income, spending, savings, or budget.</p></div><div id="messages" class="chat-container"><div class="chat-bubble chat-bubble-ai">Hi! Try: “Where did I spend the most money this month?”</div></div><form id="chat-form" class="p-3 d-flex gap-2"><input id="message" class="form-control form-control-custom" placeholder="Ask a financial question…" required><button class="btn btn-primary-custom">Send</button></form></div></div></div>{% endblock %}{% block scripts %}<script>const form=document.querySelector('#chat-form'),input=document.querySelector('#message'),box=document.querySelector('#messages');form.addEventListener('submit',async e=>{e.preventDefault();let q=input.value.trim();if(!q)return;box.insertAdjacentHTML('beforeend',`<div class="chat-bubble chat-bubble-user"></div>`);box.lastElementChild.textContent=q;input.value='';let r=await fetch('{{ url_for("ai.chatbot") }}',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:q})});let d=await r.json();box.insertAdjacentHTML('beforeend',`<div class="chat-bubble chat-bubble-ai"></div>`);box.lastElementChild.textContent=d.response||d.error;box.scrollTop=box.scrollHeight;});</script>{% endblock %}
