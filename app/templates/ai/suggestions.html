{% extends 'base.html' %}{% block content %}<div class="d-flex justify-content-between align-items-center mb-4"><div><h1 class="h2 mb-1">AI budget suggestions</h1><p class="text-secondary-custom mb-0">Recommended allocation for ₹{{ '{:,.0f}'.format(income) }} monthly income.</p></div><form method="post"><button class="btn btn-primary-custom">Apply these budgets</button></form></div><div class="row g-3">{% for category,amount in suggestions.items() %}<div class="col-md-6 col-lg-4"><div class="glass-card p-4"><span class="text-secondary-custom">{{ category }}</span><h2 class="h3 mb-0 mt-2">₹{{ '{:,.0f}'.format(amount) }}</h2></div></div>{% endfor %}</div>{% endblock %}
