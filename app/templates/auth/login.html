{% extends 'base.html' %}{% block title %}Login · FinanceAI{% endblock %}{% block content %}
<div class="row justify-content-center"><div class="col-md-6 col-lg-5"><div class="glass-card p-4 p-md-5"><h1 class="h3">Welcome back</h1><p class="text-secondary-custom">Log in to manage your money.</p><form method="post"><div class="mb-3"><label class="form-label">Email</label><input class="form-control form-control-custom" name="email" type="email" required></div><div class="mb-3"><label class="form-label">Password</label><input class="form-control form-control-custom" name="password" type="password" required></div><div class="form-check mb-4"><input class="form-check-input" name="remember" type="checkbox" id="remember"><label class="form-check-label" for="remember">Remember me</label></div><button class="btn btn-primary-custom w-100">Log in</button></form><p class="mt-4 mb-0 text-center"><a href="{{ url_for('auth.reset_password') }}">Forgot password?</a> · <a href="{{ url_for('auth.register') }}">Create account</a></p></div></div></div>{% endblock %}
