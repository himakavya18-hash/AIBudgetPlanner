{% extends 'base.html' %}{% block content %}<div class="row justify-content-center"><div class="col-lg-8"><div class="glass-card p-4"><h1 class="h3">Profile settings</h1><form method="post" class="row g-3 mt-1"><div class="col-md-6"><label class="form-label">Username</label><input class="form-control form-control-custom" name="username" value="{{ current_user.username }}" required></div><div class="col-md-6"><label class="form-label">Email</label><input class="form-control form-control-custom" type="email" name="email" value="{{ current_user.email }}" required></div><div class="col-md-6"><label class="form-label">Monthly income goal (₹)</label><input class="form-control form-control-custom" type="number" step="0.01" name="monthly_income_goal" value="{{ current_user.monthly_income_goal }}"></div><div class="col-md-6"><label class="form-label">New password</label><input class="form-control form-control-custom" type="password" name="new_password"></div><div class="col-md-6"><label class="form-label">Confirm new password</label><input class="form-control form-control-custom" type="password" name="confirm_password"></div><div class="col-12"><button class="btn btn-primary-custom">Save changes</button></div></form></div></div></div>{% endblock %}
