{% extends 'base.html' %}{% block content %}<div class="row justify-content-center"><div class="col-md-7 col-lg-6"><div class="glass-card p-4 p-md-5"><h1 class="h3">Create your account</h1><form method="post" class="mt-4"><div class="mb-3"><label class="form-label">Username</label><input class="form-control form-control-custom" name="username" required></div><div class="mb-3"><label class="form-label">Email</label><input class="form-control form-control-custom" name="email" type="email" required></div><div class="mb-3"><label class="form-label">Password</label><input class="form-control form-control-custom" name="password" type="password" minlength="8" required></div><div class="mb-4"><label class="form-label">Confirm password</label><input class="form-control form-control-custom" name="confirm_password" type="password" required></div><button class="btn btn-primary-custom w-100">Create account</button></form><p class="mt-4 mb-0 text-center">Already registered? <a href="{{ url_for('auth.login') }}">Log in</a></p></div></div></div>{% endblock %}
