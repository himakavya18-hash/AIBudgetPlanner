{% extends 'base.html' %}{% block content %}<div class="row justify-content-center"><div class="col-md-6"><div class="glass-card p-5"><h1 class="h3">Reset password</h1><p class="text-secondary-custom">For a production app, send a time-limited email token instead of accepting a new password here.</p><form method="post"><input class="form-control form-control-custom mb-3" name="email" type="email" placeholder="Email" required><input class="form-control form-control-custom mb-3" name="new_password" type="password" placeholder="New password" minlength="8" required><input class="form-control form-control-custom mb-4" name="confirm_password" type="password" placeholder="Confirm password" required><button class="btn btn-primary-custom">Reset password</button></form></div></div></div>{% endblock %}
